<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Karttaproto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

  <style>
    #map {
      height: 80vh;
      width: 100%;
    }
    #controls {
      margin: 10px;
    }
    button {
      margin-left: 5px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

<h3>Karttaproto – pisteiden ja viivojen piirto</h3>
<div id="controls">
  <label for="colorPicker">Oletusväri: </label>
  <input type="color" id="colorPicker" value="#ff0000">
  <button id="saveBtn">Tallenna JSON</button>
  <input type="file" id="fileInput" accept=".json">
  <button id="loadBtn">Lataa JSON</button>
</div>
<div id="map"></div>

<!--
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

-->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
  var map = L.map('map').setView([64, 26], 6);

  // Offline tile layer
  //L.tileLayer('tiles/{z}/{x}/{y}.png', {
	 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 6,
    maxZoom: 18,
    attribution: '© OpenStreetMap'
  }).addTo(map);


  // Rajoita näkymä Suomen alueelle
  var southWest = L.latLng(59, 19),
      northEast = L.latLng(71, 32);
  map.setMaxBounds(L.latLngBounds(southWest, northEast));

  // Piirtokerros
  var drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  var drawControl = new L.Control.Draw({
    edit: { featureGroup: drawnItems },
    draw: { polygon:false, rectangle:false, circle:true, marker:true, polyline:true }
  });
  map.addControl(drawControl);

  function attachPopup(layer) {
    layer.feature = layer.feature || { type:"Feature", properties:{} };
    layer.feature.properties.color = layer.feature.properties.color || "#ff0000";
    layer.feature.properties.description = layer.feature.properties.description || "";
    if (layer instanceof L.Circle) layer.feature.properties.radius = layer.getRadius();

    var popupContent = `
      <div>
        <label>Väri:</label><br>
        <input type="color" id="colorInput" value="${layer.feature.properties.color}"><br><br>
        <label>Kuvaus:</label><br>
        <input type="text" id="descInput" value="${layer.feature.properties.description}"><br><br>
        ${layer instanceof L.Circle ? '<label>Säde (m):</label><br><input type="number" id="radiusInput" value="' + layer.feature.properties.radius + '"><br><br>' : ''}
        <button id="saveAttrBtn">Tallenna attribuutit</button>
      </div>
    `;
    layer.bindPopup(popupContent);

    layer.on("popupopen", function() {
      var colorInput = document.getElementById("colorInput");
      colorInput.oninput = function() {
        var newColor = colorInput.value;
        if (layer instanceof L.Marker) {
          var icon = L.divIcon({
            className:"custom-marker",
            html:`<div style="background:${newColor};width:16px;height:16px;border-radius:50%;border:2px solid #000"></div>`,
            iconSize:[16,16],
            iconAnchor:[8,8]
          });
          layer.setIcon(icon);
        } else if (layer instanceof L.Polyline) {
          layer.setStyle({color:newColor, weight:4});
        } else if (layer instanceof L.Circle) {
          layer.setStyle({color:newColor, fillColor:newColor, fillOpacity:0.6});
        }
      };

      document.getElementById("saveAttrBtn").onclick = function() {
        var newColor = document.getElementById("colorInput").value;
        var newDesc = document.getElementById("descInput").value;
        layer.feature.properties.color = newColor;
        layer.feature.properties.description = newDesc;
        if (layer instanceof L.Circle) {
          var newRadius = parseFloat(document.getElementById("radiusInput").value);
          layer.feature.properties.radius = newRadius;
          layer.setRadius(newRadius);
        }
        layer.closePopup();
      };
    });
  }

  map.on(L.Draw.Event.CREATED, function(event) {
    var layer = event.layer;
    var selectedColor = document.getElementById("colorPicker").value;

    if (layer instanceof L.Marker) {
      var icon = L.divIcon({
        className:"custom-marker",
        html:`<div style="background:${selectedColor};width:16px;height:16px;border-radius:50%;border:2px solid #000"></div>`,
        iconSize:[16,16],
        iconAnchor:[8,8]
      });
      layer.setIcon(icon);
    } else if (layer instanceof L.Polyline) {
      layer.setStyle({color:selectedColor, weight:4});
    } else if (layer instanceof L.Circle) {
      layer.setStyle({color:selectedColor, fillColor:selectedColor, fillOpacity:0.6});
    }

    layer.feature = {type:"Feature", properties:{color:selectedColor, description:""}};
    if (layer instanceof L.Circle) layer.feature.properties.radius = layer.getRadius();

    attachPopup(layer);
    drawnItems.addLayer(layer);
    layer.openPopup();
  });

  document.getElementById("saveBtn").onclick = function() {
    var data = [];
    drawnItems.eachLayer(function(layer) {
      var geojson = layer.toGeoJSON();
      geojson.properties = {
        color: layer.feature.properties.color,
        description: layer.feature.properties.description,
        timestamp: new Date().toISOString()
      };
      if (layer instanceof L.Circle) geojson.properties.radius = layer.feature.properties.radius;
      data.push(geojson);
    });
    var blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "kartta.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  document.getElementById("loadBtn").onclick = function() {
    var fileInput = document.getElementById("fileInput");
    if (fileInput.files.length===0){ alert("Valitse JSON-tiedosto!"); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var data = JSON.parse(e.target.result);
      data.forEach(function(feature){
        var layer;
        if(feature.geometry.type==="Point"){
          var coords = feature.geometry.coordinates;
          if(feature.properties.radius){
            layer = L.circle([coords[1],coords[0]],{
              radius:feature.properties.radius,
              color:feature.properties.color,
              fillColor:feature.properties.color,
              fillOpacity:0.6
            });
          } else {
            var icon = L.divIcon({
              className:"custom-marker",
              html:`<div style="background:${feature.properties.color};width:16px;height:16px;border-radius:50%;border:2px solid #000"></div>`,
              iconSize:[16,16],
              iconAnchor:[8,8]
            });
            layer = L.marker([coords[1],coords[0]],{icon:icon});
          }
        } else if(feature.geometry.type==="LineString"){
          var coords = feature.geometry.coordinates.map(c=>[c[1],c[0]]);
          layer = L.polyline(coords,{color:feature.properties.color,weight:4});
        }
        if(layer){
          layer.feature=feature;
          attachPopup(layer);
          drawnItems.addLayer(layer);
        }
      });
    };
    reader.readAsText(fileInput.files[0]);
  };
</script>

</body>
</html>
